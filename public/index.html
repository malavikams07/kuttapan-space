<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kuttappan's Space — Welcome</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --accent:#6a5acd;
      --accent2:#ff6f91;
      --card-bg: rgba(255,255,255,0.95);
      --muted:#7a7a90;
    }
    /* full-screen lily background with soft overlay */
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}
    body{
      background-image: url('images/lily-bg.jpg');
      background-size: cover;
      background-position: center;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      color:#222;
    }
    /* soft dim layer so text is readable */
    body::before{
      content:"";
      position: absolute;
      inset:0;
      background: linear-gradient(135deg, rgba(255,255,255,0.28), rgba(240,248,255,0.28));
      backdrop-filter: blur(4px) saturate(1.02);
      z-index:0;
    }

    .card{
      position:relative;
      z-index:1;
      width:360px;
      padding:18px;
      border-radius:18px;
      background:var(--card-bg);
      box-shadow: 0 12px 36px rgba(20,20,60,0.12);
      text-align:center;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
    }

    /* couple photo — round and prominent */
    .couple {
      width:110px;
      height:110px;
      border-radius:50%;
      overflow:hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      border:6px solid rgba(255,255,255,0.85);
      transform: translateY(-32px);
      background:#fff;
    }
    .couple img{ width:100%; height:100%; object-fit:cover; display:block; }

    h1{ margin:0; font-size:20px; color:var(--accent); letter-spacing:0.2px; }
    .tag{ color:var(--muted); font-size:13px; margin-top:4px; }

    /* welcome note */
    .welcome-note{
      background: linear-gradient(90deg, rgba(255,255,255,0.6), rgba(255,245,250,0.6));
      padding:8px 12px;
      border-radius:12px;
      font-style: italic;
      color:#5a4b86;
      font-weight:600;
      box-shadow: 0 6px 16px rgba(106,90,205,0.06);
      margin-top:4px;
    }

    form{ width:100%; display:flex; flex-direction:column; gap:8px; align-items:center; padding:8px 6px; }
    input{
      width:88%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #e5e5ee;
      font-size:14px;
      outline:none;
    }
    button{
      width:88%;
      padding:10px 12px;
      border-radius:10px;
      border:none;
      color:white;
      background: linear-gradient(90deg,var(--accent), #5b84d6);
      font-weight:700;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(106,90,205,0.14);
    }

    .avatars{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      margin-top:6px;
    }
    .avatar{
      width:56px;
      height:56px;
      border-radius:50%;
      overflow:hidden;
      border:3px solid transparent;
      transition: transform .18s ease, border-color .18s;
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
    .avatar.selected{
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(106,90,205,0.9);
      box-shadow: 0 8px 20px rgba(106,90,205,0.14);
    }

    .hint{ font-size:13px; color:var(--muted); margin-top:8px; text-align:center; }
    .small{ font-size:12px; color:#aaa; margin-top:6px; }
  </style>
</head>
<body>
  <div class="card" role="main" aria-labelledby="title">
    <div class="couple" aria-hidden="true">
      <!-- replace images/couple.jpg with your photo -->
      <img src="images/couple.jpg" alt="Our photo">
    </div>

    <h1 id="title">🌌 Kuttappan's Space</h1>
    <div class="tag">A private place for two — made with love</div>

    <div class="welcome-note">varanam mister varanam</div>

    <!-- avatars row -->
    <div class="avatars" aria-hidden="false">
      <div class="avatar" id="avatar-Innu" data-username="Innu" title="Innu">
        <img src="images/avatar-innu.png" alt="Innu">
      </div>
      <div class="avatar" id="avatar-Kuttu" data-username="Kuttu" title="Kuttu">
        <img src="images/avatar-kuttu.png" alt="Kuttu">
      </div>
    </div>

    <!-- login form -->
    <form method="POST" action="/login" id="loginForm">
      <input name="username" id="username" placeholder="Username (Innu or Kuttu)" required autocomplete="off">
      <input name="password" id="password" type="password" placeholder="Password" required>
      <button type="submit">Enter the Space</button>
    </form>

    <div class="hint">Allowed users: <strong>Innu / Innu123</strong> &nbsp; • &nbsp; <strong>Kuttu / Kuttu123</strong></div>
    <div class="small">Tip: click an avatar to auto-fill the username.</div>
  </div>

  <script>
    // Avatar click & username auto-fill behavior
    const avatars = document.querySelectorAll('.avatar');
    const usernameInput = document.getElementById('username');

    // map username => avatar element id
    function setSelectedAvatar(user) {
      avatars.forEach(a => {
        if (a.dataset.username.toLowerCase() === (user||'').toLowerCase()) {
          a.classList.add('selected');
        } else a.classList.remove('selected');
      });
    }

    avatars.forEach(a => {
      a.addEventListener('click', () => {
        const user = a.dataset.username;
        usernameInput.value = user;
        setSelectedAvatar(user);
        document.getElementById('password').focus();
      });
    });

    // highlight avatar while typing username
    usernameInput.addEventListener('input', () => {
      setSelectedAvatar(usernameInput.value);
    });

    // initialize selection if username prefilled
    setSelectedAvatar(usernameInput.value);
  </script>
</body>
</html>
